name: signoz

services:
  init-clickhouse:
    image: clickhouse/clickhouse-server:25.12.5
    container_name: signoz-init-clickhouse
    restart: on-failure
    command:
      - bash
      - -c
      - |
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mkdir -p /var/lib/clickhouse/user_scripts
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse/
    logging:
      options:
        max-size: 50m
        max-file: "3"

  zookeeper-1:
    image: signoz/zookeeper:3.9.3
    container_name: signoz-zookeeper-1
    user: root
    restart: unless-stopped
    volumes:
      - ./data/zookeeper:/bitnami/zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_AUTOPURGE_INTERVAL=1
      - ZOO_ENABLE_PROMETHEUS_METRICS=yes
      - ZOO_PROMETHEUS_METRICS_PORT_NUMBER=9141
    healthcheck:
      test:
        - CMD-SHELL
        - curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options:
        max-size: 50m
        max-file: "3"

  clickhouse:
    image: clickhouse/clickhouse-server:25.12.5
    container_name: signoz-clickhouse
    tty: true
    restart: unless-stopped
    depends_on:
      init-clickhouse:
        condition: service_completed_successfully
      zookeeper-1:
        condition: service_healthy
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse/
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.xml
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.xml
      - ./clickhouse/custom-function.xml:/etc/clickhouse-server/custom-function.xml
      - ./clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - 0.0.0.0:8123/ping
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options:
        max-size: 50m
        max-file: "3"

  schema-migrator-sync:
    image: signoz/signoz-schema-migrator:v0.144.6
    container_name: signoz-schema-migrator-sync
    restart: on-failure
    depends_on:
      clickhouse:
        condition: service_healthy
    command:
      - sync
      - --dsn=tcp://clickhouse:9000
      - --up=
    logging:
      options:
        max-size: 50m
        max-file: "3"

  schema-migrator-async:
    image: signoz/signoz-schema-migrator:v0.144.6
    container_name: signoz-schema-migrator-async
    restart: on-failure
    depends_on:
      clickhouse:
        condition: service_healthy
      schema-migrator-sync:
        condition: service_completed_successfully
    command:
      - async
      - --dsn=tcp://clickhouse:9000
      - --up=
    logging:
      options:
        max-size: 50m
        max-file: "3"

  signoz:
    image: signoz/signoz:v0.134.0
    container_name: signoz
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      schema-migrator-sync:
        condition: service_completed_successfully
    ports:
      - "8080:8080" # UI do SigNoz
    command:
      - --config=/root/config/prometheus.yml
    volumes:
      - ./signoz/prometheus.yml:/root/config/prometheus.yml
      - ./dashboards:/root/config/dashboards
      - ./data/sqlite:/var/lib/signoz/
    environment:
      - SIGNOZ_JWT_SECRET=${SIGNOZ_JWT_SECRET}
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_SQLSTORE_SQLITE_PATH=/var/lib/signoz/signoz.db
      - DASHBOARDS_PATH=/root/config/dashboards
      - STORAGE=clickhouse
      - GODEBUG=netdns=go
      - DEPLOYMENT_TYPE=docker-standalone-amd
      - SIGNOZ_ALERTMANAGER_PROVIDER=signoz
      - SIGNOZ_STATSREPORTER_ENABLED=false
      - SIGNOZ_EMAILING_ENABLED=false
      - DOT_METRICS_ENABLED=true
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - localhost:8080/api/v1/health
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options:
        max-size: 50m
        max-file: "3"

  otel-collector:
    image: signoz/signoz-otel-collector:v0.144.6
    container_name: signoz-otel-collector
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      schema-migrator-sync:
        condition: service_completed_successfully
      signoz:
        condition: service_healthy
    command:
      - --config=/etc/otel-collector-config.yaml
      - --manager-config=/etc/manager-config.yaml
      - --copy-path=/var/tmp/collector-config.yaml
      - --feature-gates=-pkg.translator.prometheus.NormalizeName
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
      - ./signoz/otel-collector-opamp-config.yaml:/etc/manager-config.yaml
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=signoz-host,os.type=linux
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
    logging:
      options:
        max-size: 50m
        max-file: "3"
